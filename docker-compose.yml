services:
  db:
    image: postgres:16-alpine
    environment:
      # Boot as the default superuser; the init script creates the app role
      # `propman` as a NON-superuser. RLS policies do not bind superusers,
      # so tenant isolation must never run over a superuser connection.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgres://propman:propman@db:5432/propman
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgres://propman:propman@db:5432/propman
      REDIS_URL: redis://redis:6379/0
    command: celery -A config worker -l info -B
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
