name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Boot as the default superuser; the app role is created as a
          # NON-superuser in a step below. RLS policies do not bind
          # superusers, so the tenant-isolation tests fail (by design) if
          # the app connects as one.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://propman:propman@localhost:5432/propman
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Create non-superuser application role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE propman LOGIN PASSWORD 'propman' NOSUPERUSER CREATEDB;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE propman OWNER propman;"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: pytest -q
